<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylık Puantaj</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 15px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        select { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        .day-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; margin-bottom: 8px; background: #f8f9fa; border-radius: 8px; border-left: 5px solid #3498db; }
        .weekend { background: #ffeaa7; border-left-color: #e1b12c; }
        .day-label { font-weight: bold; font-size: 15px; min-width: 130px; }
        .day-select { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        #ozetKutusu { margin-top: 20px; padding: 12px; background: #e8f4f8; border-radius: 8px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>Aylık Puantaj</h2>
    
    <div class="controls">
        <select id="yilSecim" onchange="puantajYukle()">
            <option value="2026">2026</option>
            <option value="2027">2027</option>
        </select>
        <select id="aySecim" onchange="puantajYukle()">
            <option value="0">Ocak</option>
            <option value="1">Şubat</option>
            <option value="2">Mart</option>
            <option value="3">Nisan</option>
            <option value="4">Mayıs</option>
            <option value="5">Haziran</option>
            <option value="6">Temmuz</option>
            <option value="7">Ağustos</option>
            <option value="8" selected>Eylül</option>
            <option value="9">Ekim</option>
            <option value="10">Kasım</option>
            <option value="11">Aralık</option>
        </select>
    </div>

    <div id="gunlerListesi"></div>
    <div id="ozetKutusu"></div>
</div>

<script>
    const firmalar = ["Çalışmadı / Tatil", "Firma A", "Firma B", "Firma C", "Diğer"];
    const gunAdlari = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
    const ayAdlari = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    function puantajYukle() {
        const yil = parseInt(document.getElementById('yilSecim').value);
        const ay = parseInt(document.getElementById('aySecim').value);
        const listeDiv = document.getElementById('gunlerListesi');
        listeDiv.innerHTML = "";

        const kayitKey = `puantaj_${yil}_${ay}`;
        const kayitVerisi = JSON.parse(localStorage.getItem(kayitKey)) || {};

        const toplamGun = new Date(yil, ay + 1, 0).getDate();

        for (let gun = 1; gun <= toplamGun; gun++) {
            const tarih = new Date(yil, ay, gun);
            const gunIndex = tarih.getDay();
            const gunAdiStr = gunAdlari[gunIndex];
            const isWeekend = (gunIndex === 0 || gunIndex === 6);

            const row = document.createElement('div');
            row.className = "day-row" + (isWeekend ? " weekend" : "");

            const label = document.createElement('div');
            label.className = "day-label";
            label.innerText = `${gun} ${ayAdlari[ay]} (${gunAdiStr})`;

            const select = document.createElement('select');
            select.className = "day-select";
            select.dataset.gun = gun;

            firmalar.forEach(firma => {
                const opt = document.createElement('option');
                opt.value = firma;
                opt.text = firma;
                select.appendChild(opt);
            });

            if (kayitVerisi[gun]) {
                select.value = kayitVerisi[gun];
            }

            select.onchange = function() {
                veriKaydetVeOzetle();
            };

            row.appendChild(label);
            row.appendChild(select);
            listeDiv.appendChild(row);
        }
        veriKaydetVeOzetle();
    }

    function veriKaydetVeOzetle() {
        const yil = document.getElementById('yilSecim').value;
        const ay = document.getElementById('aySecim').value;
        const selects = document.querySelectorAll('.day-select');
        let kayitVerisi = {};
        let firmaSayimlari = {};

        selects.forEach(sel => {
            const gun = sel.dataset.gun;
            const deger = sel.value;
            kayitVerisi[gun] = deger;
            if (deger !== "Çalışmadı / Tatil") {
                firmaSayimlari[deger] = (firmaSayimlari[deger] || 0) + 1;
            }
        });

        localStorage.setItem(`puantaj_${yil}_${ay}`, JSON.stringify(kayitVerisi));

        let ozetMetni = "<b>Aylık Firma Dağılımı:</b><br>";
        let toplamCalisma = 0;

        for (let firma in firmaSayimlari) {
            ozetMetni += `- ${firma}: ${firmaSayimlari[firma]} gün<br>`;
            toplamCalisma += firmaSayimlari[firma];
        }
        ozetMetni += `<br><b>Toplam Çalışılan Gün:</b> ${toplamCalisma}`;
        document.getElementById('ozetKutusu').innerHTML = ozetMetni;
    }

    window.onload = puantajYukle;
</script>

</body>
</html>
