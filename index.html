<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Puantaj Modülü</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .header button {
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            color: #2d3748;
        }
        .header button:active {
            background: #cbd5e0;
        }
        h2 {
            margin: 0;
            color: #333;
            font-size: 18px;
            text-align: center;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .day-name {
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            color: #888;
            padding-bottom: 5px;
        }
        .day-name.weekend {
            color: #e74c3c;
        }
        .day-box {
            background: #f8f9fa;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .day-box.empty {
            border: none;
            background: transparent;
            cursor: default;
        }
        .day-num {
            font-size: 15px;
            font-weight: bold;
            color: #2d3748;
        }
        .day-text {
            font-size: 9px;
            color: #718096;
            margin-top: 1px;
        }
        .day-box.weekend {
            background-color: #fff5f5;
            border-color: #feb2b2;
        }
        .day-box.weekend .day-text {
            color: #e53e3e;
        }
        .day-box.active {
            background-color: #3182ce;
            border-color: #2b6cb0;
        }
        .day-box.active .day-num,
        .day-box.active .day-text {
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button onclick="degistirAy(-1)">❮ Önceki</button>
        <h2 id="ay-yil-baslik">Ocak 2026</h2>
        <button onclick="degistirAy(1)">Sonraki ❯</button>
    </div>
    
    <div class="calendar-grid" id="takvim-izgara">
        <!-- Gün İsimleri -->
        <div class="day-name">Pzt</div>
        <div class="day-name">Sal</div>
        <div class="day-name">Çar</div>
        <div class="day-name">Per</div>
        <div class="day-name">Cum</div>
        <div class="day-name weekend">Cmt</div>
        <div class="day-name weekend">Paz</div>
        <!-- Günler dinamik olarak buraya gelecek -->
    </div>
</div>

<script>
    const ayIsimleri = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    const gunIsimleri = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
    
    let bugun = new Date();
    let aktifYil = bugun.getFullYear();
    let aktifAy = bugun.getMonth();

    function takvimiGuncelle() {
        const baslik = document.getElementById("ay-yil-baslik");
        const izgara = document.getElementById("takvim-izgara");
        
        baslik.innerText = `${ayIsimleri[aktifAy]} ${aktifYil}`;

        // Gün isimlerini koruyarak alt kısmı temizle
        let html = `
            <div class="day-name">Pzt</div>
            <div class="day-name">Sal</div>
            <div class="day-name">Çar</div>
            <div class="day-name">Per</div>
            <div class="day-name">Cum</div>
            <div class="day-name weekend">Cmt</div>
            <div class="day-name weekend">Paz</div>
        `;

        const ilkGun = new Date(aktifYil, aktifAy, 1);
        const sonGun = new Date(aktifYil, aktifAy + 1, 0);
        
        // Pazartesi ile başlatmak için boşluk hesaplama (Pazar 0'dır, Pazartesi 1 olsun)
        let baslangicBosluk = ilkGun.getDay() - 1;
        if (baslangicBosluk === -1) baslangicBosluk = 6;

        for (let i = 0; i < baslangicBosluk; i++) {
            html += `<div class="day-box empty"></div>`;
        }

        for (let gun = 1; gun <= sonGun.getDate(); gun++) {
            let simdikiGunDate = new Date(aktifYil, aktifAy, gun);
            let gunIndex = simdikiGunDate.getDay(); // 0: Pazar, 6: Cumartesi
            let isWeekend = (gunIndex === 0 || gunIndex === 6);
            let gunAdiKisa = gunIsimleri[gunIndex];

            let storageKey = `puantaj_${aktifYil}_${aktifAy}_${gun}`;
            let isActive = localStorage.getItem(storageKey) === "true" ? "active" : "";
            let weekendClass = isWeekend ? "weekend" : "";

            html += `
                <div class="day-box ${weekendClass} ${isActive}" onclick="gunTetikle(${gun}, this)">
                    <span class="day-num">${gun}</span>
                    <span class="day-text">${gunAdiKisa}</span>
                </div>
            `;
        }

        izgara.innerHTML = html;
    }

    function degistirAy(yon) {
        aktifAy += yon;
        if (aktifAy > 11) {
            aktifAy = 0;
            aktifYil++;
        } else if (aktifAy < 0) {
            aktifAy = 11;
            aktifYil--;
        }
        takvimiGuncelle();
    }

    function gunTetikle(gun, element) {
        element.classList.toggle('active');
        let storageKey = `puantaj_${aktifYil}_${aktifAy}_${gun}`;
        if (element.classList.contains('active')) {
            localStorage.setItem(storageKey, "true");
        } else {
            localStorage.removeItem(storageKey);
        }
    }

    // İlk açılış
    takvimiGuncelle();
</script>

</body>
</html>
