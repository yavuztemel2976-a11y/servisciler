<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Servis Puantajı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            margin-bottom: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 20px;
            color: #1e3a8a;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 12px;
            color: #64748b;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            color: #1e293b;
        }
        .days-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .day-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
        }
        .day-row.weekend {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .day-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            width: 110px;
        }
        .day-row.weekend .day-label {
            color: #64748b;
        }
        .day-select {
            flex: 1;
            padding: 6px;
            font-size: 13px;
            border-radius: 6px;
        }
        .summary-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-left: 5px solid #22c55e;
            border-radius: 12px;
            padding: 12px;
            margin-top: 14px;
            font-size: 13.5px;
            color: #166534;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📅 Akıllı Servis Puantajı</h1>
        <p>Aylık Firma ve Gün Takip Paneli</p>
    </div>

    <div class="controls">
        <select id="aySecim" onchange="puantajYukle()">
            <option value="2026-09">Eylül 2026</option>
            <option value="2026-10">Ekim 2026</option>
            <option value="2026-11">Kasım 2026</option>
            <option value="2026-12">Aralık 2026</option>
        </select>
    </div>

    <div class="days-container" id="listeKapsayici"></div>

    <div class="summary-box" id="ozetKutusu">
        Toplam Çalışılan Gün: 0
    </div>
</div>

<script>
    const firmalar = ["Çalışmadı / Tatil", "X Firma", "A Firma", "B Firma", "Diğer Firma"];

    function ayGunSayisiGetir(yil, ay) {
        return new Date(yil, ay, 0).getDate();
    }

    function puantajYukle() {
        const aySecim = document.getElementById("aySecim").value;
        const [yil, ay] = aySecim.split("-").map(Number);
        const toplamGun = ayGunSayisiGetir(yil, ay);
        
        const kapsayici = document.getElementById("listeKapsayici");
        kapsayici.innerHTML = "";

        const kaydedilenVeriler = JSON.parse(localStorage.getItem("puantaj_" + aySecim)) || {};

        for (let gun = 1; gun <= toplamGun; gun++) {
            const tarih = new Date(yil, ay - 1, gun);
            const gunAdiTr = tarih.toLocaleDateString('tr-TR', { weekday: 'short' });
            const isWeekend = tarih.getDay() === 0 || tarih.getDay() === 6;

            const row = document.createElement("div");
            row.className = "day-row" + (isWeekend ? " weekend" : "");

            const label = document.createElement("div");
            label.className = "day-label";
            label.innerText = `${gun} ${aySecim.split('-')[1]} (${gunAdiTr})` + (isWeekend ? " 🏖️" : "");

            const select = document.createElement("select");
            select.className = "day-select";
            select.dataset.gun = gun;

            firmalar.forEach(firma => {
                const opt = document.createElement("option");
                opt.value = firma;
                opt.text = firma;
                if (kaydedilenVeriler[gun] === firma) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });

            if (!kaydedilenVeriler[gun]) {
                select.value = isWeekend ? "Çalışmadı / Tatil" : "X Firma";
            }

            select.onchange = function() {
                veriKaydetVeHesapla();
            };

            row.appendChild(label);
            row.appendChild(select);
            kapsayici.appendChild(row);
        }

        guncelleOzet();
    }

    function veriKaydetVeHesapla() {
        const aySecim = document.getElementById("aySecim").value;
        const selects = document.querySelectorAll(".day-select");
        const kayitVerisi = {};
        let calisilanToplam = 0;

        selects.forEach(sel => {
            const gun = sel.dataset.gun;
            const deger = sel.value;
            kayitVerisi[gun] = deger;
            if (deger !== "Çalışmadı / Tatil") {
                calisilanToplam++;
            }
        });

        localStorage.setItem("puantaj_" + aySecim, JSON.stringify(kayitVerisi));
        guncelleOzet();
    }

    function guncelleOzet() {
        const selects = document.querySelectorAll(".day-select");
        let calisilanToplam = 0;
        selects.forEach(sel => {
            if (sel.value !== "Çalışmadı / Tatil") {
                calisilanToplam++;
            }
        });
        document.getElementById("ozetKutusu").innerText = `Toplam Çalışılan Gün: ${calisilanToplam}`;
    }

    window.onload = puantajYukle;
</script>

</body>
</html>
