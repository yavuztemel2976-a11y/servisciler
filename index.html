<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticari Rota & Kâr Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; padding: 15px; }
        .container { background: #ffffff; width: 100%; max-width: 420px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .title-box { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
        .title-box h2 { font-size: 20px; color: #1e3d59; margin-bottom: 5px; }
        .title-box p { font-size: 12px; color: #666; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
        input:focus, select:focus { border-color: #007bff; outline: none; }
        .kdv-row { display: flex; align-items: center; gap: 10px; }
        .kdv-row input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .result-box { background: #f8f9fa; border-left: 4px solid #28a745; padding: 15px; border-radius: 6px; margin-top: 20px; }
        .result-box h3 { font-size: 16px; color: #1e3d59; margin-bottom: 12px; }
        .result-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #333; }
        .result-item span:last-child { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-box">
            <h2>🚐 Ticari Rota & Kâr Paneli</h2>
            <p>Esnaf ve Ticari Araç Sürücüleri İçin Profesyonel Hesaplama Aracı</p>
        </div>

        <div class="form-group">
            <label>Araç Marka ve Modeli:</label>
            <select id="vehicle">
                <option value="jumper">Citroën Jumper</option>
                <option value="ducato">Fiat Ducato</option>
                <option value="master">Renault Master</option>
                <option value="transit">Ford Transit</option>
                <option value="sprinter">Mercedes Sprinter</option>
                <option value="crafter">Volkswagen Crafter</option>
                <option value="iveco">Iveco Daily</option>
                <option value="other">Diğer Ticari Araç</option>
            </select>
        </div>

        <div class="form-group">
            <label>Günlük Yapılan Kilometre (km):</label>
            <input type="number" id="km" placeholder="Örn: 150" oninput="calculate()">
        </div>

        <div class="form-group">
            <label>Güncel Yakıt Litre Fiyatı (TL):</label>
            <input type="number" id="fuelPrice" placeholder="Örn: 45.50" oninput="calculate()">
        </div>

        <div class="form-group">
            <label>Günlük Ciro (TL):</label>
            <input type="number" id="dailyRevenue" placeholder="Örn: 7000" oninput="calculate()">
        </div>

        <div class="form-group">
            <div class="kdv-row">
                <input type="checkbox" id="kdvCheck" onchange="calculate()">
                <span>+ % KDV</span>
                <input type="number" id="kdvRate" value="10" style="width: 80px; text-align: center;" oninput="calculate()">
            </div>
        </div>

        <div class="form-group">
            <label>Aylık Çalışma Günü:</label>
            <input type="number" id="workDays" placeholder="Örn: 26" oninput="calculate()">
        </div>

        <div class="result-box">
            <h3>Hesaplama Sonucu (<span id="selectedDaysText">0</span> Günlük Toplam)</h3>
            <div class="result-item">
                <span>Toplam Yakıt Gideri:</span>
                <span id="totalFuelCost">0,00 TL</span>
            </div>
            <div class="result-item">
                <span>Toplam Ciro:</span>
                <span id="totalRevenueResult">0,00 TL</span>
            </div>
            <div class="result-item" style="border-top: 1px solid #ddd; padding-top: 8px; margin-top: 8px;">
                <span>Aylık Toplam Net Kâr:</span>
                <span id="monthlyNetProfit" style="font-size: 16px;">0,00 TL</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const km = parseFloat(document.getElementById('km').value) || 0;
            const fuelPrice = parseFloat(document.getElementById('fuelPrice').value) || 0;
            let dailyRevenue = parseFloat(document.getElementById('dailyRevenue').value) || 0;
            const workDays = parseFloat(document.getElementById('workDays').value) || 0;
            
            const kdvActive = document.getElementById('kdvCheck').checked;
            const kdvRate = parseFloat(document.getElementById('kdvRate').value) || 0;

            if (kdvActive) {
                dailyRevenue = dailyRevenue * (1 + kdvRate / 100);
            }

            // Ortalama 100 km'de ~10 litre yakıt tüketimi baz alınmıştır
            const fuelConsumptionPerKm = 0.10; 
            const dailyFuelCost = km * fuelConsumptionPerKm * fuelPrice;
            const dailyNetProfit = dailyRevenue - dailyFuelCost;

            // Girilen aylık çalışma gününe göre çarparak toplamları bulma
            const totalFuelCost = dailyFuelCost * workDays;
            const totalRevenue = dailyRevenue * workDays;
            const monthlyNetProfit = dailyNetProfit * workDays;

            document.getElementById('selectedDaysText').innerText = workDays;
            document.getElementById('totalFuelCost').innerText = totalFuelCost.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
            document.getElementById('totalRevenueResult').innerText = totalRevenue.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
            document.getElementById('monthlyNetProfit').innerText = monthlyNetProfit.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
        }
    </script>
</body>
</html>
