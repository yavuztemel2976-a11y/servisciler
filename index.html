<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticari Rota & Kâr Paneli</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a365d">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
            margin-bottom: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            color: #1e3a8a;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            color: #64748b;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            color: #1e293b;
            transition: border-color 0.2s;
        }
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .kdv-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }
        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .kdv-input {
            width: 70px !important;
            padding: 8px !important;
            text-align: center;
            font-weight: 600;
        }
        .result-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-left: 5px solid #22c55e;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }
        .result-title {
            font-size: 15px;
            font-weight: 700;
            color: #166534;
            margin-bottom: 12px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #334155;
        }
        .result-row.total {
            font-size: 16px;
            font-weight: 700;
            color: #15803d;
            border-top: 1px dashed #bbf7d0;
            padding-top: 8px;
            margin-top: 8px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚐 Ticari Rota & Kâr Paneli</h1>
        <p>Esnaf ve Ticari Araç Sürücüleri İçin Profesyonel Hesaplama Aracı</p>
    </div>

    <!-- 1. Araç Marka ve Modeli -->
    <div class="form-group">
        <label for="vehicleSelect">Araç Marka ve Modeli:</label>
        <select id="vehicleSelect" onchange="calculate()">
            <option value="10">Citroën Jumper</option>
            <option value="9">Ford Transit</option>
            <option value="11">Mercedes Sprinter</option>
            <option value="8.5">Volkswagen Crafter</option>
        </select>
    </div>

    <!-- 2. Günlük Yapılan Kilometre -->
    <div class="form-group">
        <label for="km">Günlük Yapılan Kilometre (km):</label>
        <input type="number" id="km" placeholder="Örn: 150" oninput="calculate()">
    </div>

    <!-- 3. Güncel Yakıt Litre Fiyatı -->
    <div class="form-group">
        <label for="fuelPrice">Güncel Yakıt Litre Fiyatı (TL):</label>
        <input type="number" id="fuelPrice" placeholder="Örn: 45.50" step="0.01" oninput="calculate()">
    </div>

    <!-- 4. Günlük Ciro -->
    <div class="form-group">
        <label for="revenue">Günlük Ciro (TL):</label>
        <input type="number" id="revenue" placeholder="Örn: 7000" oninput="calculate()">
    </div>

    <!-- 5. KDV Satırı -->
    <div class="form-group">
        <div class="kdv-row">
            <label class="checkbox-container">
                <input type="checkbox" id="applyKdv" onchange="calculate()"> KDV Ekle (%):
            </label>
            <input type="number" id="kdvRate" class="kdv-input" value="10" oninput="calculate()">
        </div>
    </div>

    <!-- 6. Aylık Çalışma Günü -->
    <div class="form-group">
        <label for="workDays">Aylık Çalışma Günü:</label>
        <input type="number" id="workDays" value="22" oninput="calculate()">
    </div>

    <!-- Hesaplama Sonucu -->
    <div class="result-box">
        <div class="result-title">Hesaplama Sonucu</div>
        <div class="result-row">
            <span>Günlük Yakıt Gideri:</span>
            <span id="resFuelCost">0,00 TL</span>
        </div>
        <div class="result-row">
            <span>Günlük Net Kâr:</span>
            <span id="resDailyProfit">0,00 TL</span>
        </div>
        <div class="result-row total">
            <span>Aylık Toplam Net Kâr:</span>
            <span id="resMonthlyProfit">0,00 TL</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const vehicleSelect = document.getElementById("vehicleSelect");
        const lPer100km = parseFloat(vehicleSelect.value) || 10;

        const km = parseFloat(document.getElementById("km").value) || 0;
        const fuelPrice = parseFloat(document.getElementById("fuelPrice").value) || 0;
        let revenue = parseFloat(document.getElementById("revenue").value) || 0;
        const workDays = parseFloat(document.getElementById("workDays").value) || 0;

        const applyKdv = document.getElementById("applyKdv").checked;
        const kdvRate = parseFloat(document.getElementById("kdvRate").value) || 0;

        let totalRevenue = revenue;
        if (applyKdv) {
            totalRevenue = revenue * (1 + (kdvRate / 100));
        }

        const dailyFuelCost = (km / 100) * lPer100km * fuelPrice;
        const dailyNetProfit = totalRevenue - dailyFuelCost;
        const monthlyNetProfit = dailyNetProfit * workDays;

        document.getElementById("resFuelCost").innerText = dailyFuelCost.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
        document.getElementById("resDailyProfit").innerText = dailyNetProfit.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
        document.getElementById("resMonthlyProfit").innerText = monthlyNetProfit.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
    }
</script>

</body>
</html>
