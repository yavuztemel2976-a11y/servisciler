<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aylık Puantaj ve Sefer Takibi</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            padding: 14px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.15rem;
            margin: 0 0 8px 0;
            text-align: center;
            color: #0f172a;
            font-weight: 800;
        }

        .top-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .company-box {
            flex: 1;
            display: flex;
            gap: 4px;
        }

        .company-box select {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            background: #fff;
            font-weight: 600;
        }

        .btn-add {
            background: #e2e8f0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--primary);
            white-space: nowrap;
        }

        .month-box {
            width: 125px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            background: #fff;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            margin-bottom: 8px;
        }

        .stat-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #1e40af;
            text-transform: uppercase;
            font-weight: 800;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .finance-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .finance-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .finance-item label {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .finance-item input {
            width: 100%;
            padding: 6px 8px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            box-sizing: border-box;
            font-weight: 600;
        }

        .finance-item input[type="number"] {
            text-align: right;
        }

        .kdv-box-inline {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kdv-box-inline input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            margin: 0;
        }

        .kdv-box-inline input[type="number"] {
            width: 50px !important;
            text-align: center !important;
            padding: 5px !important;
        }

        .net-box {
            grid-column: span 2;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .net-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #065f46;
            text-transform: uppercase;
        }

        .net-value {
            font-size: 1.15rem;
            font-weight: 800;
            color: #059669;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 2px;
        }

        .day-header.weekend {
            color: #dc2626;
        }

        .day-cell {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            aspect-ratio: 1.05;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .day-cell.weekend-cell {
            background-color: #fff1f2;
            border-color: #fecdd3;
        }

        .day-number {
            font-size: 0.8rem;
            font-weight: 700;
            position: absolute;
            top: 2px;
            left: 4px;
            color: var(--text-muted);
        }

        .weekend-cell .day-number {
            color: #e11d48;
        }

            height: 50%;
