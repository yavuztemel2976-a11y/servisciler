<!DOCTYPE html>
<html lang="tr">
<head>
   <link rel="manifest" href="manifest.json">
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aylık Puantaj</title>
    
    <!-- Mobil Uygulama Kimliği & Doğrudan Gömülü Dahili Simge -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aylık Puantaj">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%232563eb'/%3E%3Cpath d='M140 160c0-22 18-40 40-40h152c22 0 40 18 40 40v140c0 15-8 28-20 35v37c0 10-8 18-18 18h-20c-10 0-18-8-18-18v-20H216v20c0 10-8 18-18 18h-20c-10 0-18-8-18-18v-37c-12-7-20-20-20-35V160zm56 20c-9 0-16 7-16 16v48c0 9 7 16 16 16h120c9 0 16-7 16-16v-48c0-9-7-16-16-16H196zm-16 140c13 0 24-11 24-24s-11-24-24-24-24 11-24 24 11 24 24 24zm152 0c13 0 24-11 24-24s-11-24-24-24-24 11-24 24 11 24 24 24z' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%232563eb'/%3E%3Cpath d='M140 160c0-22 18-40 40-40h152c22 0 40 18 40 40v140c0 15-8 28-20 35v37c0 10-8 18-18 18h-20c-10 0-18-8-18-18v-20H216v20c0 10-8 18-18 18h-20c-10 0-18-8-18-18v-37c-12-7-20-20-20-35V160zm56 20c-9 0-16 7-16 16v48c0 9 7 16 16 16h120c9 0 16-7 16-16v-48c0-9-7-16-16-16H196zm-16 140c13 0 24-11 24-24s-11-24-24-24-24 11-24 24 11 24 24 24zm152 0c13 0 24-11 24-24s-11-24-24-24-24 11-24 24 11 24 24 11 24 24 24z' fill='%23ffffff'/%3E%3C/svg%3E">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --emerald-bg: #ecfdf5;
            --emerald-border: #10b981;
            --emerald-text: #047857;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: var(--text-main);
            margin: 0;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 470px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
            padding: 12px;
            box-sizing: border-box;
        }

        .app-header {
            margin: 0 0 10px 0;
            text-align: center;
        }

        h2 {
            font-size: 1.4rem;
            margin: 0;
            color: #0f172a;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .top-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            align-items: center;
        }

        .company-box {
            flex: 1;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .company-box select {
            flex: 1;
            padding: 9px 8px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            background: #ffffff;
            font-weight: 700;
            color: #1e293b;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            outline: none;
            min-width: 0;
        }

        .btn-action {
            border-radius: 10px;
            padding: 8px 9px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            border: 1.5px solid transparent;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-add {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: var(--primary);
        }

        .btn-edit {
            background: #f0f9ff;
            border-color: #bae6fd;
            color: #0284c7;
        }

        .btn-delete {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .month-box {
            width: 125px;
            padding: 9px 6px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.88rem;
            background: #ffffff;
            font-weight: 700;
            color: #1e293b;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            outline: none;
        }

        .finance-card {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .finance-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .finance-item label {
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .finance-item input {
            width: 100%;
            padding: 8px 10px;
            font-size: 1.05rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            box-sizing: border-box;
            font-weight: 800;
            color: #0f172a;
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
        }

        .finance-item input:focus {
            border-color: var(--primary);
        }

        .finance-item input[type="number"] {
            text-align: right;
        }

        .kdv-box-inline {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kdv-box-inline input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            margin: 0;
            border-radius: 6px;
        }

        .kdv-box-inline input[type="number"] {
            width: 55px !important;
            text-align: center !important;
            padding: 7px 4px !important;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .day-header {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: #64748b;
            padding-bottom: 3px;
        }

        .day-header.weekend {
            color: #e11d48;
        }

        .day-cell {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            aspect-ratio: 1.0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .day-cell:active {
            transform: scale(0.95);
        }

        .day-cell.weekend-cell {
            background-color: #fff1f2;
            border-color: #fecdd3;
        }

        .day-number {
            font-size: 0.85rem;
            font-weight: 800;
            position: absolute;
            top: 3px;
            left: 5px;
            color: #94a3b8;
        }

        .weekend-cell .day-number {
            color: #f43f5e;
        }

        .day-status-input {
            width: 90%;
            height: 60%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 900;
            margin-top: 8px;
            color: var(--primary);
            outline: none;
        }

        .day-cell.active-sefer {
            background-color: #dcfce7 !important;
            border: 2px solid #22c55e !important;
            box-shadow: 0 2px 6px rgba(34, 197, 94, 0.15);
        }

        .day-cell.active-sefer .day-status-input {
            color: #15803d !important;
        }

        .bottom-summary-card {
            background: #f0fdf4;
            border: 2px solid #86efac;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            box-shadow: 0 4px 12px rgba(22, 101, 52, 0.05);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-label {
            font-size: 0.95rem;
            font-weight: 800;
            color: #166534;
        }

        .summary-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: #15803d;
        }

        .summary-row.total-row {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border-radius: 10px;
            padding: 8px 12px;
            margin-top: 3px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.25);
        }

        .summary-row.total-row .summary-label {
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 900;
            letter-spacing: 0.01em;
        }

        .summary-row.total-row .summary-val {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h2>Aylık Puantaj</h2>
    </div>

    <div class="top-row">
        <div class="company-box">
            <select id="companySelect"></select>
            <button type="button" class="btn-action btn-add" id="btnAddCompany" title="Yeni Firma">+ Ekle</button>
            <button type="button" class="btn-action btn-edit" id="btnEditCompany" title="Firmayı Düzenle">✏️</button>
            <button type="button" class="btn-action btn-delete" id="btnDeleteCompany" title="Firmayı Sil">🗑️</button>
        </div>
        <input type="month" id="monthSelect" class="month-box">
    </div>

    <div class="finance-card">
        <div class="finance-item">
            <label>Tek Fiyat (₺)</label>
            <input type="number" id="dailyRateInput" placeholder="0" min="0" step="any">
        </div>

        <div class="finance-item">
            <label>KDV Oranı</label>
            <div class="kdv-box-inline">
                <input type="checkbox" id="kdvCheck" checked>
                <input type="number" id="kdvRateInput" value="10" min="0" max="100">
                <span style="font-size:0.95rem; font-weight:800; color:#475569;">%</span>
            </div>
        </div>

        <div class="finance-item">
            <label>Kesinti (₺)</label>
            <input type="number" id="deductionInput" placeholder="0" min="0" step="any">
        </div>

        <div class="finance-item">
            <label>Sefer Başı Yakıt (₺)</label>
            <input type="number" id="fuelDeductionInput" placeholder="0" min="0" step="any">
        </div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="bottom-summary-card">
        <div class="summary-row">
            <span class="summary-label">Toplam Tek:</span>
            <span class="summary-val" id="totalSeferCount">0</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Tek Fiyat:</span>
            <span class="summary-val" id="tekFiyatVal">0 ₺</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Toplam Gider:</span>
            <span class="summary-val" id="totalGiderVal">0 ₺</span>
        </div>
        <div class="summary-row total-row">
            <span class="summary-label">Toplam Hak Ediş:</span>
            <span class="summary-val" id="netEarningsVal">0 ₺</span>
        </div>
    </div>
</div>

<script>
    const seferPresets = ['', '/', '×', '×/', '××', '××/', '×××'];

    let puantajData = {}; 
    let companyList = ['Alber turizm'];
    let financeData = {};

    const companySelect = document.getElementById('companySelect');
    const btnAddCompany = document.getElementById('btnAddCompany');
    const btnEditCompany = document.getElementById('btnEditCompany');
    const btnDeleteCompany = document.getElementById('btnDeleteCompany');
    const monthSelect = document.getElementById('monthSelect');
    
    const dailyRateInput = document.getElementById('dailyRateInput');
    const kdvCheck = document.getElementById('kdvCheck');
    const kdvRateInput = document.getElementById('kdvRateInput');
    const deductionInput = document.getElementById('deductionInput');
    const fuelDeductionInput = document.getElementById('fuelDeductionInput');
    
    const calendarGrid = document.getElementById('calendarGrid');
    const totalSeferCount = document.getElementById('totalSeferCount');
    const tekFiyatVal = document.getElementById('tekFiyatVal');
    const totalGiderVal = document.getElementById('totalGiderVal');
    const netEarningsVal = document.getElementById('netEarningsVal');

    const now = new Date();
    monthSelect.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    function loadData() {
        try {
            const saved = localStorage.getItem('puantaj_verileri_v18');
            if (saved) puantajData = JSON.parse(saved);
            
            const savedCompanies = localStorage.getItem('puantaj_firma_listesi_v18');
            if (savedCompanies) companyList = JSON.parse(savedCompanies);

            const savedFinance = localStorage.getItem('puantaj_finans_v18');
            if (savedFinance) financeData = JSON.parse(savedFinance);
        } catch(e) {}

        updateCompanyDropdown();

        const savedCompany = localStorage.getItem('puantaj_son_firma_v18');
        if (savedCompany && companyList.includes(savedCompany)) {
            companySelect.value = savedCompany;
        }

        updateFinanceInputs();
    }

    function updateCompanyDropdown(selectedVal = '') {
        const current = selectedVal || companySelect.value || companyList[0];
        companySelect.innerHTML = '';
        companyList.forEach(comp => {
            const opt = document.createElement('option');
            opt.value = comp;
            opt.textContent = comp;
            companySelect.appendChild(opt);
        });
        if (companyList.includes(current)) companySelect.value = current;
    }

    function getFinanceKey() {
        const comp = companySelect.value || companyList[0] || 'Genel';
        return `${monthSelect.value}_${comp}`;
    }

    function updateFinanceInputs() {
        const data = financeData[getFinanceKey()] || { rate: '', kdvActive: true, kdvRate: 10, deduction: '', fuel: '' };
        dailyRateInput.value = data.rate ?? '';
        kdvCheck.checked = data.kdvActive ?? true;
        kdvRateInput.value = data.kdvRate ?? 10;
        deductionInput.value = data.deduction ?? '';
        fuelDeductionInput.value = data.fuel ?? '';
    }

    function saveFinanceInputs() {
        financeData[getFinanceKey()] = {
            rate: dailyRateInput.value,
            kdvActive: kdvCheck.checked,
            kdvRate: kdvRateInput.value,
            deduction: deductionInput.value,
            fuel: fuelDeductionInput.value
        };
        localStorage.setItem('puantaj_finans_v18', JSON.stringify(financeData));
    }

    // Yeni Firma Ekleme
    btnAddCompany.addEventListener('click', () => {
        const newComp = prompt('Yeni Firma Adı Girin:');
        if (newComp && newComp.trim() !== '') {
            const formatted = newComp.trim();
            if (!companyList.includes(formatted)) {
                companyList.push(formatted);
                localStorage.setItem('puantaj_firma_listesi_v18', JSON.stringify(companyList));
            }
            updateCompanyDropdown(formatted);
            localStorage.setItem('puantaj_son_firma_v18', formatted);
            updateFinanceInputs();
            renderCalendar();
        }
    });

    // Firma Adı Düzenleme
    btnEditCompany.addEventListener('click', () => {
        const currentComp = companySelect.value;
        if (!currentComp) return;

        const newName = prompt(`"${currentComp}" firmasının yeni adını girin:`, currentComp);
        if (newName && newName.trim() !== '' && newName.trim() !== currentComp) {
            const formattedNew = newName.trim();
            
            const idx = companyList.indexOf(currentComp);
            if (idx !== -1) companyList[idx] = formattedNew;
            localStorage.setItem('puantaj_firma_listesi_v18', JSON.stringify(companyList));

            Object.keys(puantajData).forEach(key => {
                if (key.includes(`_${currentComp}_`)) {
                    const newKey = key.replace(`_${currentComp}_`, `_${formattedNew}_`);
                    puantajData[newKey] = puantajData[key];
                    delete puantajData[key];
                }
            });
            localStorage.setItem('puantaj_verileri_v18', JSON.stringify(puantajData));

            Object.keys(financeData).forEach(key => {
                if (key.endsWith(`_${currentComp}`)) {
                    const newKey = key.replace(`_${currentComp}`, `_${formattedNew}`);
                    financeData[newKey] = financeData[key];
                    delete financeData[key];
                }
            });
            localStorage.setItem('puantaj_finans_v18', JSON.stringify(financeData));

            updateCompanyDropdown(formattedNew);
            localStorage.setItem('puantaj_son_firma_v18', formattedNew);
            updateFinanceInputs();
            renderCalendar();
        }
    });

    // Firma Silme
    btnDeleteCompany.addEventListener('click', () => {
        const currentComp = companySelect.value;
        if (!currentComp) return;

        if (companyList.length <= 1) {
            alert('Sistemde en az bir firma kalmalıdır. Bu firmayı silemezsiniz.');
            return;
        }

        const confirmDelete = confirm(`"${currentComp}" firmasını ve bu firmaya ait tüm verileri silmek istediğinize emin misiniz?`);
        if (confirmDelete) {
            companyList = companyList.filter(c => c !== currentComp);
            localStorage.setItem('puantaj_firma_listesi_v18', JSON.stringify(companyList));

            Object.keys(puantajData).forEach(key => {
                if (key.includes(`_${currentComp}_`)) {
                    delete puantajData[key];
                }
            });
            localStorage.setItem('puantaj_verileri_v18', JSON.stringify(puantajData));

            Object.keys(financeData).forEach(key => {
                if (key.endsWith(`_${currentComp}`)) {
                    delete financeData[key];
                }
            });
            localStorage.setItem('puantaj_finans_v18', JSON.stringify(financeData));

            const nextCompany = companyList[0];
            updateCompanyDropdown(nextCompany);
            localStorage.setItem('puantaj_son_firma_v18', nextCompany);
            updateFinanceInputs();
            renderCalendar();
        }
    });

    function parseSeferValue(valStr) {
        if (!valStr) return 0;
        const str = String(valStr).trim();
        
        if (!isNaN(parseFloat(str)) && isFinite(str)) {
            return parseFloat(str);
        }
        
        let count = 0;
        const xMatches = str.match(/[×xX\*]/g);
        if (xMatches) {
            count += xMatches.length * 2;
        }

        const slashMatches = str.match(/\//g);
        if (slashMatches) {
            count += slashMatches.length * 1;
        }

        return count;
    }

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        const days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
        days.forEach((d, idx) => {
            const div = document.createElement('div');
            div.className = idx >= 5 ? 'day-header weekend' : 'day-header';
            div.innerText = d;
            calendarGrid.appendChild(div);
        });

        const [year, month] = monthSelect.value.split('-').map(Number);
        if (!year || !month) return;

        const firstDayIndex = (new Date(year, month - 1, 1).getDay() + 6) % 7;
        const totalDays = new Date(year, month, 0).getDate();
        const company = companySelect.value || 'Genel';

        let totalSefer = 0;

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            calendarGrid.appendChild(emptyDiv);
        }

        for (let day = 1; day <= totalDays; day++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            const isWeekend = ((firstDayIndex + day - 1) % 7 >= 5);
            if (isWeekend) cell.classList.add('weekend-cell');
            
            const key = `${monthSelect.value}_${company}_${day}`;
            const currentVal = puantajData[key] || '';

            const daySeferCount = parseSeferValue(currentVal);
            totalSefer += daySeferCount;

            if (daySeferCount > 0) {
                cell.classList.add('active-sefer');
            }

            cell.innerHTML = `
                <div class="day-number">${day}</div>
                <input type="text" class="day-status-input" value="${currentVal}" placeholder="-" data-key="${key}">
            `;

            const inputElem = cell.querySelector('.day-status-input');

            cell.addEventListener('click', (e) => {
                if (e.target === inputElem) return;
                
                let currentStr = puantajData[key] || '';
                let currentIndex = seferPresets.indexOf(currentStr);
                let nextIndex = (currentIndex + 1) % seferPresets.length;
                let nextSymbol = seferPresets[nextIndex];

                if (nextSymbol) {
                    puantajData[key] = nextSymbol;
                } else {
                    delete puantajData[key];
                }

                localStorage.setItem('puantaj_verileri_v18', JSON.stringify(puantajData));
                renderCalendar();
            });

            inputElem.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (val) {
                    puantajData[key] = val;
                } else {
                    delete puantajData[key];
                }
                localStorage.setItem('puantaj_verileri_v18', JSON.stringify(puantajData));
                renderCalendar();
            });

            calendarGrid.appendChild(cell);
        }

        totalSeferCount.innerText = totalSefer;
        calculateFinance(totalSefer);
    }

    function calculateFinance(seferCount) {
        const ratePerSefer = parseFloat(dailyRateInput.value) || 0;
        tekFiyatVal.innerText = ratePerSefer.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';

        let gross = seferCount * ratePerSefer;

        if (kdvCheck.checked) {
            gross += gross * ((parseFloat(kdvRateInput.value) || 0) / 100);
        }

        const kesinti = parseFloat(deductionInput.value) || 0;
        
        // SEFER (TEK) BAŞI YAKIT x TOPLAM SEFER (TEK) SAYISI
        const fuelRatePerSefer = parseFloat(fuelDeductionInput.value) || 0;
        const totalFuelGider = seferCount * fuelRatePerSefer;

        const totalGider = kesinti + totalFuelGider;

        totalGiderVal.innerText = totalGider.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';

        let net = gross - totalGider;
        if (net < 0) net = 0;

        netEarningsVal.innerText = net.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';
    }

    companySelect.addEventListener('change', () => {
        localStorage.setItem('puantaj_son_firma_v18', companySelect.value);
        updateFinanceInputs();
        renderCalendar();
    });

    monthSelect.addEventListener('change', () => {
        updateFinanceInputs();
        renderCalendar();
    });

    [dailyRateInput, kdvCheck, kdvRateInput, deductionInput, fuelDeductionInput].forEach(elem => {
        elem.addEventListener('input', () => { saveFinanceInputs(); renderCalendar(); });
        elem.addEventListener('change', () => { saveFinanceInputs(); renderCalendar(); });
    });

    loadData();
    renderCalendar();
</script>

</body>
</html>
