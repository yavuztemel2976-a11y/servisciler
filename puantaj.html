<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Puantaj Takip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; padding: 20px; }
        .container { background: #ffffff; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        h2 { font-size: 18px; color: #333; text-align: center; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; font-weight: bold; text-align: center; font-size: 12px; color: #666; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-btn { aspect-ratio: 1; border: 1px solid #ddd; background: #fff; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.2s; }
        .day-btn.empty { border: none; background: transparent; cursor: default; }
        .day-btn.weekend { background-color: #fff3cd; color: #856404; border-color: #ffeeba; }
        .day-btn.active { background-color: #28a745 !important; color: white !important; border-color: #1e7e34; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button onclick="changeMonth(-1)">❮</button>
            <h2 id="month-year-title"></h2>
            <button onclick="changeMonth(1)">❯</button>
        </div>
        <div class="weekdays">
            <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
        </div>
        <div class="days-grid" id="grid"></div>
    </div>

    <script>
        const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();

        function renderCalendar() {
            const grid = document.getElementById('grid');
            const title = document.getElementById('month-year-title');
            grid.innerHTML = '';
            title.innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-btn empty';
                grid.appendChild(emptyCell);
            }

            for (let i = 1; i <= totalDays; i++) {
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.innerText = i;

                const dayOfWeek = (new Date(currentYear, currentMonth, i).getDay() + 6) % 7;
                if (dayOfWeek === 5 || dayOfWeek === 6) {
                    btn.classList.add('weekend');
                }

                const storageKey = `attendance_${currentYear}_${currentMonth}_${i}`;
                if (localStorage.getItem(storageKey) === '1') {
                    btn.classList.add('active');
                }

                btn.onclick = () => {
                    btn.classList.toggle('active');
                    if (btn.classList.contains('active')) {
                        localStorage.setItem(storageKey, '1');
                    } else {
                        localStorage.removeItem(storageKey);
                    }
                };

                grid.appendChild(btn);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
