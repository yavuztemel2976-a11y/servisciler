<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çoklu Firma Puantaj Paneli</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
        }

        .content {
            padding: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .summary-card {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .summary-item .label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .summary-item .value {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .day-header {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 4px;
        }

        .day-box {
            aspect-ratio: 1;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .day-box .day-num {
            font-size: 13px;
            font-weight: 600;
        }

        .day-box .day-status {
            font-size: 9px;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Durum Renkleri */
        .day-box.status-work {
            background-color: #dcfce7;
            border-color: #86efac;
            color: #166534;
        }

        .day-box.status-off {
            background-color: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        .day-box.status-leave {
            background-color: #fef3c7;
            border-color: #fcd34d;
            color: #92400e;
        }

        .day-box.status-empty {
            background-color: #f8fafc;
            border-color: var(--border-color);
            color: var(--text-muted);
        }

        .legend {
            display: flex;
            justify-content: space-around;
            margin-top: 16px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .btn-save {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.2s;
        }

        .btn-save:active {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Personel Puantaj Takip</h1>
        <p>Firma Bazlı Günlük Çalışma Kontrolü</p>
    </div>

    <div class="content">
        <!-- Firma Seçimi -->
        <div class="form-group">
            <label for="companySelect">Firma Seçin:</label>
            <select id="companySelect" onchange="changeCompany()">
                <option value="firma1">Firma A (Örn: Merkez Servis)</option>
                <option value="firma2">Firma B (Örn: Okul Hattı)</option>
                <option value="firma3">Firma C (Örn: Fabrika Servisi)</option>
            </select>
        </div>

        <!-- Ay Seçimi -->
        <div class="form-group">
            <label for="monthSelect">Ay Seçin:</label>
            <input type="month" id="monthSelect" value="2026-10" onchange="updateCalendarDays()">
        </div>

        <!-- Özet Bilgiler -->
        <div class="summary-card">
            <div class="summary-item">
                <div class="label">Çalışılan</div>
                <div class="value" id="countWork">0</div>
            </div>
            <div class="summary-item">
                <div class="label">İzinli / Tatil</div>
                <div class="value" id="countOff">0</div>
            </div>
            <div class="summary-item">
                <div class="label">Raporlu</div>
                <div class="value" id="countLeave">0</div>
            </div>
        </div>

        <!-- Takvim Kutucukları -->
        <div class="calendar-grid" id="calendarGrid">
            <!-- Gün başlıkları -->
            <div class="day-header">Pzt</div>
            <div class="day-header">Sal</div>
            <div class="day-header">Çar</div>
            <div class="day-header">Per</div>
            <div class="day-header">Cum</div>
            <div class="day-header">Cmt</div>
            <div class="day-header">Paz</div>
            <!-- Kutucuklar JavaScript ile dolacak -->
        </div>

        <!-- Renk Açıklamaları -->
        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#86efac;"></div> Çalıştı</div>
            <div class="legend-item"><div class="legend-dot" style="background:#fca5a5;"></div> Tatil</div>
            <div class="legend-item"><div class="legend-dot" style="background:#fcd34d;"></div> Raporlu</div>
        </div>

        <button class="btn-save" onclick="saveData()">Bilgileri Kaydet</button>
    </div>
</div>

<script>
    // Durumlar: 'empty' (Boş), 'work' (Çalıştı), 'off' (Tatil), 'leave' (Raporlu)
    const statuses = ['empty', 'work', 'off', 'leave'];
    const statusLabels = { 'empty': '-', 'work': 'Çalıştı', 'off': 'Tatil', 'leave': 'Rapor' };
    const statusClasses = { 'empty': 'status-empty', 'work': 'status-work', 'off': 'status-off', 'leave': 'status-leave' };

    let puantajData = {};

    function getCurrentKey() {
        const company = document.getElementById('companySelect').value;
        const month = document.getElementById('monthSelect').value;
        return `${company}_${month}`;
    }

    function initData() {
        const key = getCurrentKey();
        if (!puantajData[key]) {
            puantajData[key] = {};
        }
    }

    function updateCalendarDays() {
        initData();
        const grid = document.getElementById('calendarGrid');
        
        // Gün başlıklarını koruyarak temizle
        const headers = grid.querySelectorAll('.day-header');
        grid.innerHTML = '';
        headers.forEach(h => grid.appendChild(h));

        const monthVal = document.getElementById('monthSelect').value;
        const [year, month] = monthVal.split('-');
        
        // Ayın kaç gün çektiğini bul
        const daysInMonth = new Date(year, month, 0).getDate();
        
        // Ayın ilk gününün haftanın hangi günü olduğunu bul (Pazartesi için ayarla)
        let firstDayIndex = new Date(year, month - 1, 1).getDay();
        firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1; // Pazar'ı sona al

        // Boşluk bırak (ay başı hizalaması için)
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            grid.appendChild(emptyDiv);
        }

        const key = getCurrentKey();

        // Günleri oluştur
        for (let day = 1; day <= daysInMonth; day++) {
            const box = document.createElement('div');
            box.className = 'day-box';
            
            const currentStatus = puantajData[key][day] || 'empty';
            box.classList.add(statusClasses[currentStatus]);

            box.innerHTML = `
                <span class="day-num">${day}</span>
                <span class="day-status">${statusLabels[currentStatus]}</span>
            `;

            box.onclick = function() {
                cycleStatus(day);
            };

            grid.appendChild(box);
        }

        updateSummary();
    }

    function cycleStatus(day) {
        const key = getCurrentKey();
        let currentStatus = puantajData[key][day] || 'empty';
        
        let currentIndex = statuses.indexOf(currentStatus);
        let nextIndex = (currentIndex + 1) % statuses.length;
        
        puantajData[key][day] = statuses[nextIndex];
        updateCalendarDays();
    }

    function updateSummary() {
        const key = getCurrentKey();
        const monthData = puantajData[key] || {};
        
        let workCount = 0;
        let offCount = 0;
        let leaveCount = 0;

        for (let day in monthData) {
            if (monthData[day] === 'work') workCount++;
            if (monthData[day] === 'off') offCount++;
            if (monthData[day] === 'leave') leaveCount++;
        }

        document.getElementById('countWork').innerText = workCount;
        document.getElementById('countOff').innerText = offCount;
        document.getElementById('countLeave').innerText = leaveCount;
    }

    function changeCompany() {
        updateCalendarDays();
    }

    function saveData() {
        alert("Puantaj bilgileri başarıyla kaydedildi!");
    }

    // Sayfa açıldığında takvimi kur
    updateCalendarDays();
</script>

</body>
</html>
