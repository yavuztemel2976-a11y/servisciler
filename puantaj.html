<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aylık Puantaj</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 10px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1rem;
            margin: 0 0 2px 0;
            text-align: center;
            color: #0f172a;
        }

        .top-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .top-row select, .top-row input {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            background: #fff;
            box-sizing: border-box;
        }

        .company-box {
            flex: 1;
            display: flex;
            gap: 4px;
        }

        .company-box select {
            flex: 1;
        }

        .btn-add {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--primary);
            white-space: nowrap;
        }

        .month-box {
            width: 110px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }

        .stat-card {
            background: #f1f5f9;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
        }

        .finance-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 8px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .finance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .finance-row label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .finance-row input[type="number"] {
            width: 90px;
            padding: 3px 6px;
            font-size: 0.85rem;
            text-align: right;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .kdv-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 2px 6px;
        }

        .kdv-left {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .kdv-left input {
            width: 14px;
            height: 14px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .kdv-rate {
            width: 45px !important;
            text-align: center !important;
            padding: 2px !important;
            font-size: 0.75rem !important;
        }

        .net-box {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .net-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: #065f46;
            text-transform: uppercase;
        }

        .net-value {
            font-size: 1rem;
            font-weight: 800;
            color: #059669;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-bottom: 6px;
        }

        .day-header {
            text-align: center;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .day-header.weekend {
            color: #dc2626;
        }

        .day-cell {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            aspect-ratio: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .day-cell.weekend-cell {
            background-color: #fff1f2;
            border-color: #fecdd3;
        }

        .day-number {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .weekend-cell .day-number {
            color: #e11d48;
        }

        .day-status {
            font-size: 0.55rem;
            margin-top: 1px;
            color: var(--text-muted);
        }

        .day-cell.status-work {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
        }
        .day-cell.status-work .day-number,
        .day-cell.status-work .day-status {
            color: #15803d !important;
            font-weight: 700;
        }

        .day-cell.status-leave {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }
        .day-cell.status-leave .day-number,
        .day-cell.status-leave .day-status {
            color: #b91c1c !important;
            font-weight: 700;
        }

        .day-cell.status-report {
            background-color: #fef9c3 !important;
            border-color: #eab308 !important;
        }
        .day-cell.status-report .day-number,
        .day-cell.status-report .day-status {
            color: #a16207 !important;
            font-weight: 700;
        }

        .legend {
            display: flex;
            justify-content: space-around;
            font-size: 0.65rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .legend-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .btn-save {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Aylık Puantaj</h2>

    <div class="top-row">
        <div class="company-box">
            <select id="companySelect"></select>
            <button type="button" class="btn-add" id="btnAddCompany">+ Yeni</button>
        </div>
        <input type="month" id="monthSelect" class="month-box">
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Çalışılan</div>
            <div class="stat-value" id="countWork">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Tatil</div>
            <div class="stat-value" id="countLeave">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Rapor</div>
            <div class="stat-value" id="countReport">0</div>
        </div>
    </div>

    <div class="finance-card">
        <div class="finance-row">
            <label>Günlük Ciro:</label>
            <input type="number" id="dailyRateInput" placeholder="0" min="0" step="any">
        </div>

        <div class="kdv-row">
            <div class="kdv-left">
                <input type="checkbox" id="kdvCheck">
                <label for="kdvCheck" style="cursor:pointer; margin:0;">% KDV</label>
            </div>
            <input type="number" id="kdvRateInput" class="kdv-rate" value="10" min="0" max="100">
        </div>

        <div class="finance-row">
            <label>Kesinti:</label>
            <input type="number" id="deductionInput" placeholder="0" min="0" step="any">
        </div>

        <div class="finance-row">
            <label>Yakıt:</label>
            <input type="number" id="fuelDeductionInput" placeholder="0" min="0" step="any">
        </div>

        <div class="net-box">
            <div class="net-label">Net Tutar</div>
            <div class="net-value" id="netEarningsVal">0 ₺</div>
        </div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background: #22c55e;"></span> Çalıştı</div>
        <div class="legend-item"><span class="legend-dot" style="background: #ef4444;"></span> Tatil</div>
        <div class="legend-item"><span class="legend-dot" style="background: #eab308;"></span> Raporlu</div>
    </div>

    <button class="btn-save" id="btnSave">Kaydet</button>
</div>

<script>
    const states = ['', 'work', 'leave', 'report'];
    const stateLabels = { '': '-', 'work': 'Çalıştı', 'leave': 'Tatil', 'report': 'Rapor' };
    
    let puantajData = {}; 
    let companyList = []; // Başlangıçta boş
    let financeData = {};

    const companySelect = document.getElementById('companySelect');
    const btnAddCompany = document.getElementById('btnAddCompany');
    const monthSelect = document.getElementById('monthSelect');
    
    const dailyRateInput = document.getElementById('dailyRateInput');
    const kdvCheck = document.getElementById('kdvCheck');
    const kdvRateInput = document.getElementById('kdvRateInput');
    const deductionInput = document.getElementById('deductionInput');
    const fuelDeductionInput = document.getElementById('fuelDeductionInput');
    const netEarningsVal = document.getElementById('netEarningsVal');

    const calendarGrid = document.getElementById('calendarGrid');
    const countWork = document.getElementById('countWork');
    const countLeave = document.getElementById('countLeave');
    const countReport = document.getElementById('countReport');
    const btnSave = document.getElementById('btnSave');

    const now = new Date();
    monthSelect.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    function loadData() {
        const saved = localStorage.getItem('puantaj_verileri_v6');
        if (saved) { try { puantajData = JSON.parse(saved); } catch(e) {} }
        
        const savedCompanies = localStorage.getItem('puantaj_firma_listesi_v6');
        if (savedCompanies) { try { companyList = JSON.parse(savedCompanies); } catch(e) {} }

        // Eğer kayıtlı hiç firma yoksa örnek boş bırakmak yerine kullanıcı eklesin diye yönlendiriyoruz
        if (companyList.length === 0) {
            companyList = ['Firma Seçiniz / Ekle'];
        }

        const savedFinance = localStorage.getItem('puantaj_finans_v6');
        if (savedFinance) { try { financeData = JSON.parse(savedFinance); } catch(e) {} }

        updateCompanyDropdown();
        const savedCompany = localStorage.getItem('puantaj_son_firma_v6');
        if (savedCompany && companyList.includes(savedCompany)) {
            companySelect.value = savedCompany;
        }
        updateFinanceInputs();
    }

    function updateCompanyDropdown(selectedVal = '') {
        const current = selectedVal || companySelect.value || companyList[0];
        companySelect.innerHTML = '';
        companyList.forEach(comp => {
            const opt = document.createElement('option');
            opt.value = comp;
            opt.textContent = comp;
            companySelect.appendChild(opt);
        });
        if (companyList.includes(current)) companySelect.value = current;
    }

    function getFinanceKey() {
        return `${monthSelect.value}_${companySelect.value || companyList[0]}`;
    }

    function updateFinanceInputs() {
        const data = financeData[getFinanceKey()] || { rate: '', kdvActive: true, kdvRate: 10, deduction: '', fuel: '' };
        dailyRateInput.value = data.rate ?? '';
        kdvCheck.checked = data.kdvActive ?? true;
        kdvRateInput.value = data.kdvRate ?? 10;
        deductionInput.value = data.deduction ?? '';
        fuelDeductionInput.value = data.fuel ?? '';
    }

    function saveFinanceInputs() {
        financeData[getFinanceKey()] = {
            rate: dailyRateInput.value,
            kdvActive: kdvCheck.checked,
            kdvRate: kdvRateInput.value,
            deduction: deductionInput.value,
            fuel: fuelDeductionInput.value
        };
        localStorage.setItem('puantaj_finans_v6', JSON.stringify(financeData));
    }

    btnAddCompany.addEventListener('click', () => {
        const newComp = prompt('Firma adı:');
        if (newComp && newComp.trim() !== '') {
            const formatted = newComp.trim();
            // Eğer ilk varsayılan "Firma Seçiniz / Ekle" varsa listeden çıkaralım
            if (companyList.includes('Firma Seçiniz / Ekle')) {
                companyList = companyList.filter(c => c !== 'Firma Seçiniz / Ekle');
            }
            if (!companyList.includes(formatted)) {
                companyList.push(formatted);
                localStorage.setItem('puantaj_firma_listesi_v6', JSON.stringify(companyList));
            }
            updateCompanyDropdown(formatted);
            localStorage.setItem('puantaj_son_firma_v6', formatted);
            updateFinanceInputs();
            renderCalendar();
        }
    });

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        const days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
        days.forEach((d, idx) => {
            const div = document.createElement('div');
            div.className = idx >= 5 ? 'day-header weekend' : 'day-header';
            div.innerText = d;
            calendarGrid.appendChild(div);
        });

        const [year, month] = monthSelect.value.split('-').map(Number);
        if (!year || !month) return;

        const firstDayIndex = (new Date(year, month - 1, 1).getDay() + 6) % 7;
        const totalDays = new Date(year, month, 0).getDate();
        const company = companySelect.value || 'Genel';

        let counts = { work: 0, leave: 0, report: 0 };

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            calendarGrid.appendChild(emptyDiv);
        }

        for (let day = 1; day <= totalDays; day++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            const isWeekend = ((firstDayIndex + day - 1) % 7 >= 5);
            if (isWeekend) cell.classList.add('weekend-cell');
            
            const key = `${monthSelect.value}_${company}_${day}`;
            const currentState = puantajData[key] || '';

            if (currentState) {
                cell.classList.add(`status-${currentState}`);
                if(counts[currentState] !== undefined) counts[currentState]++;
            }

            cell.innerHTML = `<div class="day-number">${day}</div><div class="day-status">${stateLabels[currentState]}</div>`;

            cell.addEventListener('click', () => {
                let nextState = states[(states.indexOf(puantajData[key] || '') + 1) % states.length];
                if (nextState) puantajData[key] = nextState;
                else delete puantajData[key];
                
                localStorage.setItem('puantaj_verileri_v6', JSON.stringify(puantajData));
                renderCalendar();
            });

            calendarGrid.appendChild(cell);
        }

        countWork.innerText = counts.work;
        countLeave.innerText = counts.leave;
        countReport.innerText = counts.report;

        const dailyRate = parseFloat(dailyRateInput.value) || 0;
        let gross = counts.work * dailyRate;

        if (kdvCheck.checked) {
            gross += gross * ((parseFloat(kdvRateInput.value) || 0) / 100);
        }

        let net = gross - (parseFloat(deductionInput.value) || 0) - (parseFloat(fuelDeductionInput.value) || 0);
        if (net < 0) net = 0;

        netEarningsVal.innerText = net.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';
    }

    companySelect.addEventListener('change', () => {
        localStorage.setItem('puantaj_son_firma_v6', companySelect.value);
        updateFinanceInputs();
        renderCalendar();
    });

    monthSelect.addEventListener('change', () => {
        updateFinanceInputs();
        renderCalendar();
    });

    [dailyRateInput, kdvCheck, kdvRateInput, deductionInput, fuelDeductionInput].forEach(elem => {
        elem.addEventListener('input', () => { saveFinanceInputs(); renderCalendar(); });
        elem.addEventListener('change', () => { saveFinanceInputs(); renderCalendar(); });
    });

    btnSave.addEventListener('click', () => {
        localStorage.setItem('puantaj_verileri_v6', JSON.stringify(puantajData));
        localStorage.setItem('puantaj_firma_listesi_v6', JSON.stringify(companyList));
        localStorage.setItem('puantaj_finans_v6', JSON.stringify(financeData));
        alert('Kaydedildi!');
    });

    loadData();
    renderCalendar();
</script>

</body>
</html>
