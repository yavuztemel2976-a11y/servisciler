<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aylık Puantaj</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            padding: 14px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            text-align: center;
            color: #0f172a;
            font-weight: 800;
        }

        .top-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .company-box {
            flex: 1;
            display: flex;
            gap: 4px;
        }

        .company-box select {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            background: #fff;
            font-weight: 600;
        }

        .btn-add {
            background: #e2e8f0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--primary);
            white-space: nowrap;
        }

        .month-box {
            width: 125px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            background: #fff;
            font-weight: 600;
        }

        .finance-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .finance-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .finance-item label {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .finance-item input {
            width: 100%;
            padding: 6px 8px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            box-sizing: border-box;
            font-weight: 600;
        }

        .finance-item input[type="number"] {
            text-align: right;
        }

        .kdv-box-inline {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kdv-box-inline input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            margin: 0;
        }

        .kdv-box-inline input[type="number"] {
            width: 50px !important;
            text-align: center !important;
            padding: 5px !important;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }

        .day-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 2px;
        }

        .day-header.weekend {
            color: #dc2626;
        }

        .day-cell {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            aspect-ratio: 1.05;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .day-cell.weekend-cell {
            background-color: #fff1f2;
            border-color: #fecdd3;
        }

        .day-number {
            font-size: 0.8rem;
            font-weight: 700;
            position: absolute;
            top: 2px;
            left: 4px;
            color: var(--text-muted);
        }

        .weekend-cell .day-number {
            color: #e11d48;
        }

        .day-status-input {
            width: 85%;
            height: 50%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 800;
            margin-top: 10px;
            color: var(--primary);
            outline: none;
        }

        .day-cell.active-sefer {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
        }

        .day-cell.active-sefer .day-status-input {
            color: #15803d !important;
        }

        /* Sade Alt Özet Kartı */
        .bottom-summary-card {
            background: #f0fdf4;
            border: 1.5px solid #86efac;
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: #166534;
        }

        .summary-val {
            font-size: 0.95rem;
            font-weight: 800;
            color: #15803d;
        }

        .summary-row.total-row {
            border-top: 1px solid #bbf7d0;
            padding-top: 4px;
            margin-top: 2px;
        }

        .summary-row.total-row .summary-label {
            font-size: 0.95rem;
            color: #065f46;
        }

        .summary-row.total-row .summary-val {
            font-size: 1.2rem;
            color: #047857;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Aylık Puantaj</h2>

    <div class="top-row">
        <div class="company-box">
            <select id="companySelect"></select>
            <button type="button" class="btn-add" id="btnAddCompany">+ Yeni Firma</button>
        </div>
        <input type="month" id="monthSelect" class="month-box">
    </div>

    <div class="finance-card">
        <div class="finance-item">
            <label>Tek Fiyat (₺)</label>
            <input type="number" id="dailyRateInput" placeholder="0" min="0" step="any">
        </div>

        <div class="finance-item">
            <label>KDV Oranı</label>
            <div class="kdv-box-inline">
                <input type="checkbox" id="kdvCheck" checked>
                <input type="number" id="kdvRateInput" value="10" min="0" max="100">
                <span style="font-size:0.8rem; font-weight:700;">%</span>
            </div>
        </div>

        <div class="finance-item">
            <label>Kesinti (₺)</label>
            <input type="number" id="deductionInput" placeholder="0" min="0" step="any">
        </div>

        <div class="finance-item">
            <label>Yakıt (₺)</label>
            <input type="number" id="fuelDeductionInput" placeholder="0" min="0" step="any">
        </div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="bottom-summary-card">
        <div class="summary-row">
            <span class="summary-label">Toplam Tek:</span>
            <span class="summary-val"><span id="totalSeferCount">0</span> Sefer</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Tek Fiyat:</span>
            <span class="summary-val" id="tekFiyatVal">0 ₺</span>
        </div>
        <div class="summary-row total-row">
            <span class="summary-label">Toplam Hak Ediş:</span>
            <span class="summary-val" id="netEarningsVal">0 ₺</span>
        </div>
    </div>
</div>

<script>
    const seferPresets = ['', '/', '×', '×/', '××', '××/', '×××'];

    let puantajData = {}; 
    let companyList = ['Alber turizm'];
    let financeData = {};

    const companySelect = document.getElementById('companySelect');
    const btnAddCompany = document.getElementById('btnAddCompany');
    const monthSelect = document.getElementById('monthSelect');
    
    const dailyRateInput = document.getElementById('dailyRateInput');
    const kdvCheck = document.getElementById('kdvCheck');
    const kdvRateInput = document.getElementById('kdvRateInput');
    const deductionInput = document.getElementById('deductionInput');
    const fuelDeductionInput = document.getElementById('fuelDeductionInput');
    
    const calendarGrid = document.getElementById('calendarGrid');
    const totalSeferCount = document.getElementById('totalSeferCount');
    const tekFiyatVal = document.getElementById('tekFiyatVal');
    const netEarningsVal = document.getElementById('netEarningsVal');

    const now = new Date();
    monthSelect.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    function loadData() {
        try {
            const saved = localStorage.getItem('puantaj_verileri_v17');
            if (saved) puantajData = JSON.parse(saved);
            
            const savedCompanies = localStorage.getItem('puantaj_firma_listesi_v17');
            if (savedCompanies) companyList = JSON.parse(savedCompanies);

            const savedFinance = localStorage.getItem('puantaj_finans_v17');
            if (savedFinance) financeData = JSON.parse(savedFinance);
        } catch(e) {}

        updateCompanyDropdown();

        const savedCompany = localStorage.getItem('puantaj_son_firma_v17');
        if (savedCompany && companyList.includes(savedCompany)) {
            companySelect.value = savedCompany;
        }

        updateFinanceInputs();
    }

    function updateCompanyDropdown(selectedVal = '') {
        const current = selectedVal || companySelect.value || companyList[0];
        companySelect.innerHTML = '';
        companyList.forEach(comp => {
            const opt = document.createElement('option');
            opt.value = comp;
            opt.textContent = comp;
            companySelect.appendChild(opt);
        });
        if (companyList.includes(current)) companySelect.value = current;
    }

    function getFinanceKey() {
        const comp = companySelect.value || companyList[0] || 'Genel';
        return `${monthSelect.value}_${comp}`;
    }

    function updateFinanceInputs() {
        const data = financeData[getFinanceKey()] || { rate: '', kdvActive: true, kdvRate: 10, deduction: '', fuel: '' };
        dailyRateInput.value = data.rate ?? '';
        kdvCheck.checked = data.kdvActive ?? true;
        kdvRateInput.value = data.kdvRate ?? 10;
        deductionInput.value = data.deduction ?? '';
        fuelDeductionInput.value = data.fuel ?? '';
    }

    function saveFinanceInputs() {
        financeData[getFinanceKey()] = {
            rate: dailyRateInput.value,
            kdvActive: kdvCheck.checked,
            kdvRate: kdvRateInput.value,
            deduction: deductionInput.value,
            fuel: fuelDeductionInput.value
        };
        localStorage.setItem('puantaj_finans_v17', JSON.stringify(financeData));
    }

    btnAddCompany.addEventListener('click', () => {
        const newComp = prompt('Yeni Firma Adı Girin:');
        if (newComp && newComp.trim() !== '') {
            const formatted = newComp.trim();
            if (!companyList.includes(formatted)) {
                companyList.push(formatted);
                localStorage.setItem('puantaj_firma_listesi_v17', JSON.stringify(companyList));
            }
            updateCompanyDropdown(formatted);
            localStorage.setItem('puantaj_son_firma_v17', formatted);
            updateFinanceInputs();
            renderCalendar();
        }
    });

    function parseSeferValue(valStr) {
        if (!valStr) return 0;
        const str = String(valStr).trim();
        
        if (!isNaN(parseFloat(str)) && isFinite(str)) {
            return parseFloat(str);
        }
        
        let count = 0;
        const xMatches = str.match(/[×xX\*]/g);
        if (xMatches) {
            count += xMatches.length * 2;
        }

        const slashMatches = str.match(/\//g);
        if (slashMatches) {
            count += slashMatches.length * 1;
        }

        return count;
    }

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        const days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
        days.forEach((d, idx) => {
            const div = document.createElement('div');
            div.className = idx >= 5 ? 'day-header weekend' : 'day-header';
            div.innerText = d;
            calendarGrid.appendChild(div);
        });

        const [year, month] = monthSelect.value.split('-').map(Number);
        if (!year || !month) return;

        const firstDayIndex = (new Date(year, month - 1, 1).getDay() + 6) % 7;
        const totalDays = new Date(year, month, 0).getDate();
        const company = companySelect.value || 'Genel';

        let totalSefer = 0;

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            calendarGrid.appendChild(emptyDiv);
        }

        for (let day = 1; day <= totalDays; day++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            const isWeekend = ((firstDayIndex + day - 1) % 7 >= 5);
            if (isWeekend) cell.classList.add('weekend-cell');
            
            const key = `${monthSelect.value}_${company}_${day}`;
            const currentVal = puantajData[key] || '';

            const daySeferCount = parseSeferValue(currentVal);
            totalSefer += daySeferCount;

            if (daySeferCount > 0) {
                cell.classList.add('active-sefer');
            }

            cell.innerHTML = `
                <div class="day-number">${day}</div>
                <input type="text" class="day-status-input" value="${currentVal}" placeholder="-" data-key="${key}">
            `;

            const inputElem = cell.querySelector('.day-status-input');

            cell.addEventListener('click', (e) => {
                if (e.target === inputElem) return;
                
                let currentStr = puantajData[key] || '';
                let currentIndex = seferPresets.indexOf(currentStr);
                let nextIndex = (currentIndex + 1) % seferPresets.length;
                let nextSymbol = seferPresets[nextIndex];

                if (nextSymbol) {
                    puantajData[key] = nextSymbol;
                } else {
                    delete puantajData[key];
                }

                localStorage.setItem('puantaj_verileri_v17', JSON.stringify(puantajData));
                renderCalendar();
            });

            inputElem.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (val) {
                    puantajData[key] = val;
                } else {
                    delete puantajData[key];
                }
                localStorage.setItem('puantaj_verileri_v17', JSON.stringify(puantajData));
                
                let newTotal = 0;
                for (let d = 1; d <= totalDays; d++) {
                    const k = `${monthSelect.value}_${company}_${d}`;
                    newTotal += parseSeferValue(puantajData[k]);
                }
                totalSeferCount.innerText = newTotal;
                calculateFinance(newTotal);
            });

            calendarGrid.appendChild(cell);
        }

        totalSeferCount.innerText = totalSefer;
        calculateFinance(totalSefer);
    }

    function calculateFinance(seferCount) {
        const ratePerSefer = parseFloat(dailyRateInput.value) || 0;
        tekFiyatVal.innerText = ratePerSefer.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';

        let gross = seferCount * ratePerSefer;

        if (kdvCheck.checked) {
            gross += gross * ((parseFloat(kdvRateInput.value) || 0) / 100);
        }

        let net = gross - (parseFloat(deductionInput.value) || 0) - (parseFloat(fuelDeductionInput.value) || 0);
        if (net < 0) net = 0;

        netEarningsVal.innerText = net.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';
    }

    companySelect.addEventListener('change', () => {
        localStorage.setItem('puantaj_son_firma_v17', companySelect.value);
        updateFinanceInputs();
        renderCalendar();
    });

    monthSelect.addEventListener('change', () => {
        updateFinanceInputs();
        renderCalendar();
    });

    [dailyRateInput, kdvCheck, kdvRateInput, deductionInput, fuelDeductionInput].forEach(elem => {
        elem.addEventListener('input', () => { saveFinanceInputs(); renderCalendar(); });
        elem.addEventListener('change', () => { saveFinanceInputs(); renderCalendar(); });
    });

    loadData();
    renderCalendar();
</script>

</body>
</html>
